name: CI

# ─────────────────────────────────────────────────────────────────────────
# Everything here runs on GitHub's free runners, never on the contributor's
# machine. That is deliberate: compiling a Tauri + Rust tree is heavy, and the
# target machine is an i3 with 8 GB of RAM that is already ~80% occupied.
# The developer never has to run `cargo build` to get a working .exe.
#
# Layout: detect what changed → run only the lanes that can be affected, in
# parallel → report one green check (`gate`). An agent pushing a one-line
# Markdown fix never waits behind the Rust compiler; an agent touching Rust
# never waits behind `npm ci`.
#
#   changes ──┬── frontend   ubuntu   prettier · svelte-check · node --test
#             ├── rust       windows  fmt · clippy -D warnings · cargo test
#             ├── go         ubuntu   gofmt · vet · test -race
#             ├── go-build   ubuntu   cross-compile t9cloud × 3 targets
#             └── gate       ubuntu   ← the single check to look at
#   build     windows  installer — push to main only, after frontend + rust
#
# `build` is intentionally NOT part of `gate`: it is a release artifact, not
# a merge gate. A failing installer must stay visible but must not make every
# agent wait 10 minutes for a green tick.
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Which lanes can this change possibly break? ───────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      # `|| steps.all.…` covers workflow_dispatch, where there is no diff to
      # filter against — a manual run means "check everything".
      frontend: ${{ steps.filter.outputs.frontend || steps.all.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust || steps.all.outputs.rust }}
      go: ${{ steps.filter.outputs.go || steps.all.outputs.go }}
      docs: ${{ steps.filter.outputs.docs || steps.all.outputs.docs }}
      ci: ${{ steps.filter.outputs.ci || steps.all.outputs.ci }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'Clipchamp_Bunny/src/**'
              - 'Clipchamp_Bunny/package.json'
              - 'Clipchamp_Bunny/package-lock.json'
              - 'Clipchamp_Bunny/vite.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.js'
              - 'svelte.config.js'
              - 'tsconfig.json'
              - '.prettierrc'
              - '.prettierignore'
              - '.editorconfig'
              - '.gitattributes'
            rust:
              - 'src-tauri/**'
              - 'Clipchamp_Bunny/src-tauri/**'
            go:
              - 'go/**'
            docs:
              - '**/*.md'
            ci:
              - '.github/workflows/**'

      - name: Manual run checks everything
        if: github.event_name == 'workflow_dispatch'
        id: all
        run: |
          echo "frontend=true" >> "$GITHUB_OUTPUT"
          echo "rust=true" >> "$GITHUB_OUTPUT"
          echo "go=true" >> "$GITHUB_OUTPUT"
          echo "docs=true" >> "$GITHUB_OUTPUT"
          echo "ci=true" >> "$GITHUB_OUTPUT"

  # ── Lane 1: types, formatting, unit tests (ubuntu boots in seconds) ───
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.ci == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Prettier owns every text file in the repo — .ts, .svelte, .json,
      # .yml and .md alike. This single step is also the Markdown gate.
      - name: Check formatting (all files, including Markdown)
        run: npm run lint

      # Docs-only changes skip type-check and tests: nothing there can break
      # them, and this is what keeps a README fix at ~30 seconds.
      - name: Type-check (svelte-check + tsc)
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
        run: npm run check

      - name: Unit tests (node --test, no framework)
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
        run: npm test

  # ── Lane 2: Rust — on Windows because the product IS Windows ──────────
  # Stays on windows-latest on purpose, not sloth: T9EditorLIT only ever
  # ships as a Windows .exe, and `memory.rs` measures the Windows process
  # tree. Testing that on Linux would be a green tick about the wrong OS.
  # The speed comes from running in parallel with `frontend`, not from
  # switching OS.
  rust:
    name: Rust
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting (Rust)
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Lint (clippy)
        working-directory: src-tauri
        # -D warnings turns CI into a hard gate: a slow or memory-leaky
        # snippet cannot merge quietly.
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test

  # ── Lane 3: Go cloud daemon ───────────────────────────────────────────
  # Independent of the Rust lane on purpose: it checks in seconds, and a
  # regression in it should not wait behind a Rust toolchain download. Ubuntu,
  # not Windows: `test -race` needs gcc and the script below is bash.
  go:
    name: Go daemon
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true'
    defaults:
      run:
        working-directory: go

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          # The vault pulls in gotd/td, so there IS a go.sum to cache now —
          # the module cache is what keeps this lane fast.
          cache: true
          cache-dependency-path: go/go.sum

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: go/coverage.out
          if-no-files-found: ignore
          retention-days: 7

  # ── Daemon binaries for every platform ────────────────────────────────
  # Plain GOOS/GOARCH cross-compilation with CGO off. Docker + buildx + QEMU (the
  # old approach) took minutes and could not even resolve a Windows
  # base image for the windows/amd64 entry.
  go-build:
    name: Build t9cloud (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [changes, go]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true'

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64

    defaults:
      run:
        working-directory: go

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: true
          cache-dependency-path: go/go.sum

      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          out="bin/t9cloud-${GOOS}-${GOARCH}${ext}"
          go build -trimpath \
            -ldflags "-s -w -X github.com/engrtarun/T9EditorLIT/go/internal/api.Version=${GITHUB_SHA::7}" \
            -o "$out" ./cmd/t9cloud
          echo "OUT=$out" >> "$GITHUB_ENV"

      # Run what we built — but only where the binary matches this runner.
      - name: Smoke test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: ./bin/t9cloud-linux-amd64 -version

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: t9cloud-${{ matrix.goos }}-${{ matrix.goarch }}
          path: go/bin/t9cloud-*
          retention-days: 30

  # ── Release build: Windows installer, produced on GitHub ──────────────
  # PRs stop at `gate` (fast feedback); the installer is built for pushes
  # to main and for manual runs, once the two code lanes have passed.
  build:
    name: Build Windows installer
    runs-on: windows-latest
    needs: [changes, frontend, rust]
    if: >-
      always() &&
      !cancelled() &&
      github.event_name != 'pull_request' &&
      needs.frontend.result != 'failure' &&
      needs.rust.result != 'failure' &&
      (needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.rust == 'true' ||
       needs.changes.outputs.ci == 'true')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # windows-latest already includes the MSVC toolchain and WebView2, which
      # are the only Windows prerequisites Tauri v2 needs.

      - name: Install frontend dependencies
        run: npm ci

      - name: Build
        run: npm run tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: T9EditorLIT-windows
          path: src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error
          retention-days: 30

  # ── The artifact the sarkari deploy installs ──────────────────────────
  # The deploy pipeline used to compile here, on the i3 that runs the app.
  # That build takes twelve minutes, it dies in the linker when memory runs
  # out (rustc exits 0xffffffff), and it holds the build lock every other
  # agent is waiting for. So the compile moved to this runner: GitHub's
  # Windows box has 7 GB of RAM and a CPU of its own, and the machine that
  # runs the app now only verifies a hash and installs.
  #
  # What comes out is deliberately the same shape the local build produced,
  # because deploy.ps1 installs out of a manifest either way:
  #
  #   sarkari-manifest.json  buildId, hashes, versions, the CI run URL
  #   t9-editor-lit.exe      the app, byte for byte what build.ps1 leaves
  #   t9cloud.exe            the daemon, stamped with the Go source hash
  #
  # The daemon's version is a hash of the Go sources, and it is computed by
  # tools/go-build-id.ps1 - the same file deploy.ps1 dot-sources. Two copies
  # of that algorithm would drift, and a perfectly good CI daemon would
  # then look stale to the deploy.
  sarkari-artifact:
    name: Sarkari artifact (app + daemon)
    runs-on: windows-latest
    needs: [changes, frontend, rust, go]
    if: >-
      always() &&
      !cancelled() &&
      github.event_name != 'pull_request' &&
      needs.frontend.result != 'failure' &&
      needs.rust.result != 'failure' &&
      needs.go.result != 'failure' &&
      (needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.rust == 'true' ||
       needs.changes.outputs.go == 'true' ||
       needs.changes.outputs.ci == 'true')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Clipchamp_Bunny/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Clipchamp_Bunny/src-tauri

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: true
          cache-dependency-path: go/go.sum

      - name: Install dependencies
        run: |
          npm ci
          Push-Location Clipchamp_Bunny
          npm ci
          Pop-Location

      # One identity, computed once, used by everything below. The Go id is
      # the hash of the Go sources, and deploy.ps1 refuses to call a work
      # order shipped unless the installed daemon carries this exact value.
      - name: Work out the identity
        id: ident
        shell: pwsh
        run: |
          $goId = & pwsh -NoProfile -File tools/go-build-id.ps1
          if (-not $goId) { throw 'could not compute the Go source id' }
          $short = $env:GITHUB_SHA.Substring(0, 7)
          "go_id=$goId" >> $env:GITHUB_OUTPUT
          "build_id=ci-$short" >> $env:GITHUB_OUTPUT

      - name: Build the app
        shell: pwsh
        env:
          T9_BUILD_ID: ${{ steps.ident.outputs.build_id }}
        working-directory: Clipchamp_Bunny
        run: npx tauri build --no-bundle

      - name: Build the Go daemon
        shell: pwsh
        env:
          GO_ID: ${{ steps.ident.outputs.go_id }}
        working-directory: go
        run: |
          New-Item -ItemType Directory -Force -Path ../dist | Out-Null
          go build -trimpath -ldflags "-s -w -X github.com/engrtarun/T9EditorLIT/go/internal/api.Version=$env:GO_ID" -o ../dist/t9cloud.exe ./cmd/t9cloud

      - name: Collect the artifacts
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $dist = Join-Path $root 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $exe = Join-Path $root 'Clipchamp_Bunny\src-tauri\target\release\t9-editor-lit.exe'
          if (-not (Test-Path $exe)) { throw "the build did not produce $exe" }
          Copy-Item $exe $dist -Force

      # The manifest is the contract. deploy.ps1 refuses to install an
      # executable whose SHA-256 is not the one written here, and it warns
      # when the commit it names is not the commit you are standing on.
      - name: Write the manifest
        shell: pwsh
        env:
          BUILD_ID: ${{ steps.ident.outputs.build_id }}
          GO_ID: ${{ steps.ident.outputs.go_id }}
        run: |
          $root = $env:GITHUB_WORKSPACE
          $dist = Join-Path $root 'dist'
          $exe = Join-Path $dist 't9-editor-lit.exe'
          $daemon = Join-Path $dist 't9cloud.exe'
          $appSha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $daemonSha = (Get-FileHash $daemon -Algorithm SHA256).Hash.ToLowerInvariant()
          $daemonVersion = ((& $daemon -version) | Out-String).Trim() -split '\s+' | Select-Object -Last 1
          if ($daemonVersion -ne $env:GO_ID) {
            throw "the built daemon reports '$daemonVersion', expected '$($env:GO_ID)'"
          }
          $manifest = [ordered]@{
            schema     = 1
            kind       = 'sarkari-ci-artifact'
            buildId    = $env:BUILD_ID
            builtAt    = (Get-Date).ToUniversalTime().ToString('o')
            gitCommit  = $env:GITHUB_SHA
            gitShort   = $env:GITHUB_SHA.Substring(0, 7)
            gitBranch  = $env:GITHUB_REF_NAME
            ciRunId    = $env:GITHUB_RUN_ID
            ciRunUrl   = "$($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID)"
            goSourceId = $env:GO_ID
            app        = [ordered]@{
              asset = 't9-editor-lit.exe'
              sha256 = $appSha
              size  = (Get-Item $exe).Length
            }
            daemon     = [ordered]@{
              asset   = 't9cloud.exe'
              sha256  = $daemonSha
              size    = (Get-Item $daemon).Length
              version = $daemonVersion
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $dist 'sarkari-manifest.json') -Encoding UTF8
          Write-Host "manifest written for $($env:BUILD_ID)"

      # A rolling release, so deploy.ps1 -Ci has one stable URL to fetch and
      # no GitHub CLI on the machine. The assets are replaced on every green
      # run; a failed run leaves the previous good ones in place.
      - name: Publish the rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-latest
          name: ci-latest
          prerelease: true
          files: |
            dist/t9-editor-lit.exe
            dist/t9cloud.exe
            dist/sarkari-manifest.json

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarkari-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # ── The one check to look at ───────────────────────────────────────────
  # Every lane above is path-filtered, so on any given push some are skipped.
  # Required checks that go missing block merges forever — this job always
  # runs and fails if any lane that DID run failed. Point branch protection
  # (and every AI agent) at `All checks passed` and nothing else.
  gate:
    name: All checks passed
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, frontend, rust, go, go-build]

    steps:
      - name: Every lane succeeded or was intentionally skipped
        env:
          RESULTS: >-
            ${{ needs.changes.result }}
            ${{ needs.frontend.result }}
            ${{ needs.rust.result }}
            ${{ needs.go.result }}
            ${{ needs.go-build.result }}
        run: |
          echo "lane results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::a required lane ended as '$r'"
              exit 1
            fi
          done

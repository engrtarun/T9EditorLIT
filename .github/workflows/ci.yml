name: CI

# ─────────────────────────────────────────────────────────────────────────
# Everything here runs on GitHub's free runners, never on the contributor's
# machine. That is deliberate: compiling a Tauri + Rust tree is heavy, and the
# target machine is an i3 with 8 GB of RAM that is already ~80% occupied.
# The developer never has to run `cargo build` to get a working .exe.
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Fast gate: types, formatting, lints, unit tests ──────────────────
  check:
    name: Check
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Check formatting (frontend)
        run: npm run lint

      - name: Type-check (svelte-check + tsc)
        run: npm run check

      - name: Check formatting (Rust)
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Lint (clippy)
        working-directory: src-tauri
        # -D warnings turns CI into a hard gate: a slow or memory-leaky
        # snippet cannot merge quietly.
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test

  # ── Go cloud worker daemon ────────────────────────────────────────────
  # Independent of the desktop gate on purpose: the daemon has zero
  # third-party dependencies, so it checks in seconds, and a regression in it
  # should not wait behind a Rust toolchain download.
  go:
    name: Check Go daemon
    runs-on: windows-latest
    defaults:
      run:
        working-directory: go

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          # go.mod rather than go.sum: the daemon has zero third-party
          # dependencies, so no go.sum exists. setup-go needs a real file to
          # hash, and pointing at a missing one errors on every run.
          cache-dependency-path: go/go.mod

      # `shell: bash` matters here: this job runs on windows-latest, whose
      # default shell is PowerShell, where $(...) and [ -n ] are not valid.
      # Written in plain PowerShell it fails to parse, and the job dies on a
      # syntax error that looks nothing like a formatting problem.
      - name: Check formatting (gofmt)
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on these files:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt clean"

      - name: Vet
        run: go vet ./...

      - name: Test
        shell: bash
        run: |
          if [ "$(go env CGO_ENABLED)" = "1" ]; then
            go test -race -coverprofile=coverage.out ./...
          else
            echo "cgo unavailable on this runner — running without -race"
            go test -coverprofile=coverage.out ./...
          fi

      - name: Upload coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: go/coverage.out
          retention-days: 7

  # ── Daemon binaries for every platform ───────────────────────────────
  # Cross-compiled with the Go toolchain, NOT via Docker. The daemon is a
  # static CGO_ENABLED=0 binary with no third-party dependencies, so Docker
  # adds nothing but a second moving part — and alpine has no windows/amd64
  # manifest, which failed the whole matrix on the previous run.
  go-build:
    name: Build t9cloud
    runs-on: ubuntu-latest
    needs: go

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: windows
            arch: amd64
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Cross-compile
        working-directory: go
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          # -trimpath keeps build paths out of the binary so it is reproducible.
          go build -trimpath -ldflags "-s -w" \
            -o "dist/t9cloud-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" \
            ./cmd/t9cloud

          # A binary that cannot run is worse than no binary: fail the build.
          if [ "${{ matrix.os }}" = "windows" ]; then
            file "dist/t9cloud-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          else
            chmod +x "dist/t9cloud-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
            ./"dist/t9cloud-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" -version
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: t9cloud-${{ matrix.os }}-${{ matrix.arch }}
          path: go/dist/
          if-no-files-found: error
          retention-days: 30

  # ── Container image (linux only — alpine has no Windows manifest) ─────
  go-docker:
    name: Build t9cloud image
    runs-on: ubuntu-latest
    needs: go

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: go
          platforms: linux/amd64
          push: false
          outputs: type=oci,dest=/tmp/t9cloud-image.tar

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: t9cloud-image-linux-amd64
          path: /tmp/t9cloud-image.tar
          if-no-files-found: error
          retention-days: 30

  # ── Release build: Windows installer, produced on GitHub ─────────────
  build:
    name: Build Windows installer
    runs-on: windows-latest
    needs: [check, go]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # windows-latest already includes the MSVC toolchain and WebView2, which
      # are the only Windows prerequisites Tauri v2 needs.

      - name: Install frontend dependencies
        run: npm ci

      - name: Build
        run: npm run tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: T9EditorLIT-windows
          path: src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error
          retention-days: 30

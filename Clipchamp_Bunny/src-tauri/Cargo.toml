[package]
name = "nanami-cut"
version = "0.1.0"
description = "Nanami Cut — zero-RAM, transcript-first video cutter for long Hinglish tech tutorials"
authors = ["Tarun Dilwal"]
edition = "2024"

[lib]
name = "nanami_cut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
rusqlite = { version = "0.40", features = ["bundled"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[package]
name = "t9-editor-lit"
version = "0.1.0"
description = "T9 Editor LIT — zero-RAM, transcript-first video cutter for long Hinglish tech tutorials"
authors = ["Tarun Dilwal"]
edition = "2024"

[lib]
name = "t9_editor_lit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
rusqlite = { version = "0.40", features = ["bundled"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# "thin" instead of "fat": the binary is a couple of percent bigger and the
# runtime speed is the same, but the link step drops from ~20 minutes to a
# few - which is what makes the taskbar build actually usable for iteration.
lto = "thin"
# 16, not 1: with a single codegen unit the linker needs well over a gigabyte
# of RAM, and this app has to build on a machine with 8 GB that is already
# mostly busy. More units mean a much lighter link, and the binary is within
# a percent of the same size.
codegen-units = 16
opt-level = 3
panic = "abort"
strip = true
